services:
  nav:
    build: .
    container_name: nav-php
    env_file:
      - .env
    volumes:
      - ./src:/var/www/html:ro
      #- ./config.php:/var/www/html/config.php:ro
      - ${NPM_DATA_PATH}:/data:ro
      - ${GDOCS_PATH}:/docs:ro
    ports:
      - 8085:80
    environment:
      - RESTART_TOKEN=${RESTART_TOKEN}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - LOG_LINES=${LOG_LINES:-50}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "sh", "-c", "test $(ls -1 /docs/*.html 2>/dev/null | wc -l) -gt 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
